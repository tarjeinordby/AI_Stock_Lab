# Portfolio version registry — execution logic, risk management, and position sizing.
#
# SCOPE: Rules that determine HOW the portfolio acts on signal recommendations:
#   - position sizing and target weights
#   - pyramid buying rules
#   - sector concentration limits
#   - stop-loss and trailing stop thresholds
#   - drawdown protection
#   - rebalancing and buy/sell rules based on signal ranking
#   - cash management
#   - macro portfolio exposure multiplier (capital allocation, not scoring)
#
# NOT in this file:
#   - Signal scoring weights and factor definitions → model_versions.yml
#   - Fill/price/commission/gap/execution rules → execution_versions.yml
#
# MACRO REGIME SPLIT (see also model_versions.yml):
#   model_versions.yml:     momentum_delta / quality_delta → affects ticker ranking
#   HERE (portfolio):       inverted_exposure_multiplier = 0.80
#                           → reduces capital deployed when yield curve inverted
#   Same inversion_threshold_pct = -0.50% triggers both.
#
# portfolio_config_hash: SHA-256 of all fields except portfolio_config_hash.
# Cross-validated against live scoring.STRATEGIES by modules/versioning.py.

risk_parity_pyramid_v1:
  description: >
    Full risk-managed portfolio. Risk-parity position sizing (score²/vol60),
    pyramid buying (60% initial + 40% fill), per-strategy stop-loss and trailing
    stop, sector cap, correlation filter, macro exposure adjustment, and
    drawdown protection. This is the original live paper portfolio logic.
  created_at: "2026-08-05"
  frozen: false
  portfolio_config_hash: "f2821d58d24d3093ce57ea11c698e3cfc7fb1ac64d2aba3e433004f74af2fd5f"

  config:

    # ------------------------------------------------------------------
    # PER-STRATEGY PORTFOLIO PARAMETERS
    # Source: modules/scoring.py STRATEGIES (non-signal fields)
    # These control how the portfolio uses signal rankings — not how scores
    # are computed.
    # ------------------------------------------------------------------
    strategies:
      Max_Return_AI:
        max_positions: 10
        max_position_weight: 0.15
        max_new_buys_per_week: 5
        buy_top_n: 20
        min_score_percentile: 0.80
        sell_rank_threshold: 120
        stop_loss: -0.22
        trailing_stop: -0.28
        buyback_cooldown_days: 7
        exposure:
          explosive: 1.00
          bullish: 1.00
          neutral: 0.70
          defensive: 0.40
          unknown: 0.60

      Quality_Momentum_AI:
        max_positions: 10
        max_position_weight: 0.13
        max_new_buys_per_week: 4
        buy_top_n: 20
        min_score_percentile: 0.78
        sell_rank_threshold: 110
        stop_loss: -0.18
        trailing_stop: -0.25
        buyback_cooldown_days: 10
        exposure:
          explosive: 0.95
          bullish: 0.90
          neutral: 0.65
          defensive: 0.35
          unknown: 0.55

      Balanced_AI:
        max_positions: 10
        max_position_weight: 0.12
        max_new_buys_per_week: 4
        buy_top_n: 18
        min_score_percentile: 0.75
        sell_rank_threshold: 110
        stop_loss: -0.18
        trailing_stop: -0.25
        buyback_cooldown_days: 10
        exposure:
          explosive: 0.90
          bullish: 0.85
          neutral: 0.60
          defensive: 0.30
          unknown: 0.50

      Low_Risk_AI:
        max_positions: 12
        max_position_weight: 0.10
        max_new_buys_per_week: 3
        buy_top_n: 25
        min_score_percentile: 0.70
        sell_rank_threshold: 100
        stop_loss: -0.15
        trailing_stop: -0.22
        buyback_cooldown_days: 10
        exposure:
          explosive: 0.80
          bullish: 0.75
          neutral: 0.50
          defensive: 0.25
          unknown: 0.45

      MegaCap_AI:
        max_positions: 8
        max_position_weight: 0.15
        max_new_buys_per_week: 3
        buy_top_n: 25
        min_score_percentile: 0.65
        sell_rank_threshold: 100
        stop_loss: -0.18
        trailing_stop: -0.25
        buyback_cooldown_days: 10
        exposure:
          explosive: 0.90
          bullish: 0.85
          neutral: 0.55
          defensive: 0.30
          unknown: 0.50

      AI_Sentiment_AI:
        max_positions: 10
        max_position_weight: 0.13
        max_new_buys_per_week: 4
        buy_top_n: 20
        min_score_percentile: 0.75
        sell_rank_threshold: 110
        stop_loss: -0.18
        trailing_stop: -0.25
        buyback_cooldown_days: 7
        exposure:
          explosive: 0.95
          bullish: 0.90
          neutral: 0.60
          defensive: 0.30
          unknown: 0.50

    # ------------------------------------------------------------------
    # GENERAL PORTFOLIO RULES
    # Source: modules/portfolio.py
    # ------------------------------------------------------------------
    general:
      min_position_value_usd: 500
      sector_cap: 0.25
      risk_parity_formula: "score_squared_divided_by_vol60"
      vol60_clip_low: 0.15
      vol60_clip_high: 1.50
      start_capital_usd: 10000.0

    # ------------------------------------------------------------------
    # PYRAMID BUYING
    # Source: modules/portfolio.py execute_buy() / execute_pyramid_fill()
    # ------------------------------------------------------------------
    pyramid:
      initial_fill_fraction: 0.60
      pyramid_fill_fraction: 0.40
      min_trading_days_before_fill: 5
      min_gain_before_fill: 0.02
      min_price_multiplier: 1.02

    # ------------------------------------------------------------------
    # EXIT RULES
    # Source: modules/risk.py should_sell_position()
    # stop_loss / trailing_stop thresholds are per-strategy (above).
    # ------------------------------------------------------------------
    exit_rules:
      sell_if_below_sma200: true
      rank_score_exit:
        rank_above: "sell_rank_threshold"
        score_below: 45
      score_degradation_exit:
        min_days_held: 10
        min_buy_score: 20
        max_retained_fraction: 0.65

    # ------------------------------------------------------------------
    # DRAWDOWN PROTECTION
    # Source: modules/portfolio.py _get_effective_exposure()
    #         modules/risk.py drawdown_protection_message()
    # ------------------------------------------------------------------
    drawdown_protection:
      level_1_threshold: -0.20
      level_1_max_exposure: 0.50
      level_2_threshold: -0.30
      level_2_max_exposure: 0.20

    # ------------------------------------------------------------------
    # MACRO PORTFOLIO EXPOSURE (capital allocation, not scoring)
    # Counterpart to macro_inversion_score_adjustment in model_versions.yml.
    # When inverted, exposure across all strategies is scaled by this multiplier.
    # Source: modules/macro.py INVERSION_THRESHOLD, exposure_mult
    # ------------------------------------------------------------------
    macro_portfolio_exposure:
      inversion_threshold_pct: -0.50
      inverted_exposure_multiplier: 0.80

