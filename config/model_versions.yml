    # ------------------------------------------------------------------
    # PER-STRATEGY SIGNAL AND EXECUTION CONFIG
    # Source: modules/scoring.py STRATEGIES
    # ------------------------------------------------------------------
    strategies:
      Max_Return_AI:
        score_column: "score_max_return"
