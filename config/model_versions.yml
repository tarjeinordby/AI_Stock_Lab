    # ------------------------------------------------------------------
    # DATA SOURCES
    # ------------------------------------------------------------------
    data_sources:
      price_data: "yfinance daily period=2y auto_adjust=False"
      fundamentals: "yfinance .info (current NOT point-in-time)"
      macro: "Treasury.gov 10Y-2Y yield curve no-api-key cache=24h"
