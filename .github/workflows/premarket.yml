name: Pre-market — Hent pre-market priser

on:
  schedule:
    - cron: "15 13 * * 1-5"  # 13:15 UTC = 15:15 Oslo = 09:15 ET
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ai-stock-lab-premarket
  cancel-in-progress: false

jobs:
  premarket:
    runs-on: ubuntu-latest

    env:
      BOT_MODE: premarket

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        run: python stock_bot.py

      - name: Commit premarket data
        if: always()
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git pull --rebase origin main

          git add data_v4/state/premarket_prices.json || true

          if git diff --cached --quiet; then
            echo "Ingen endringer å committe."
            exit 0
          fi

          git commit -m "Premarket: $(date -u +%Y-%m-%d)"

          for attempt in 1 2 3; do
            if git push origin main; then
              echo "Push OK ✅"
              exit 0
            fi
            echo "Push feilet (forsøk $attempt/3) — henter nyeste og prøver igjen..."
            git pull --rebase origin main
          done

          echo "Push feilet etter 3 forsøk ❌"
          exit 1
