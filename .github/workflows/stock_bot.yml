name: Run Stock Bot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "signal | execute"
        required: true
        default: "signal"
        type: choice
        options:
          - signal
          - execute

permissions:
  contents: write

concurrency:
  group: ai-stock-lab
  cancel-in-progress: false

jobs:
  run-stock-bot:
    runs-on: ubuntu-latest

    env:
      BOT_MODE: ${{ github.event.inputs.mode }}

      # Telegram brukes kun i execute-modus.
      # Signal skal kjøre stille i bakgrunnen.
      TELEGRAM_BOT_TOKEN: ${{ github.event.inputs.mode == 'execute' && secrets.TELEGRAM_BOT_TOKEN || '' }}
      TELEGRAM_CHAT_ID: ${{ github.event.inputs.mode == 'execute' && secrets.TELEGRAM_CHAT_ID || '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check environment variables
        run: |
          if [ -z "$BOT_MODE" ]; then
            echo "BOT_MODE mangler"
            exit 1
          fi

          echo "BOT_MODE=$BOT_MODE"

          if [ "$BOT_MODE" = "execute" ]; then
            if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
              echo "TELEGRAM_BOT_TOKEN mangler i execute-modus"
              exit 1
            fi

            if [ -z "$TELEGRAM_CHAT_ID" ]; then
              echo "TELEGRAM_CHAT_ID mangler i execute-modus"
              exit 1
            fi

            echo "Telegram secrets finnes ✅"
          else
            echo "Signal-modus: Telegram er deaktivert ✅"
          fi

      - name: Run stock bot
        run: python stock_bot.py

      - name: Commit updated data files
        if: always()
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git pull --rebase origin main || true

          if [ -d "data" ]; then
            git add data/
          fi

          if [ -d "data_v3" ]; then
            git add data_v3/
          fi

          if git diff --cached --quiet; then
            echo "Ingen data-endringer å committe."
          else
            git commit -m "Update AI Stock Lab data"
            git push origin main
          fi
