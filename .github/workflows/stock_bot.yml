name: Run Stock Bot

on:
  workflow_dispatch:
  schedule:
  - cron: "45 15 * * 1-5"
    timezone: "Europe/Oslo"

permissions:
  contents: write

jobs:
  run-stock-bot:
    runs-on: ubuntu-latest

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check environment variables
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "TELEGRAM_BOT_TOKEN mangler"
            exit 1
          fi

          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_CHAT_ID mangler"
            exit 1
          fi

          echo "Telegram secrets finnes ✅"

      - name: Run stock bot
        run: python stock_bot.py

      - name: Commit updated portfolio files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add data/*.csv || true

          if git diff --cached --quiet; then
            echo "Ingen portfolio-endringer å committe."
          else
            git commit -m "Update paper portfolio data"
            git push
          fi
