name: Run Stock Bot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "signal | execute"
        required: true
        default: "signal"
        type: choice
        options:
          - signal
          - execute

permissions:
  contents: write

concurrency:
  group: ai-stock-lab
  cancel-in-progress: false

jobs:
  run-stock-bot:
    runs-on: ubuntu-latest

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BOT_MODE: ${{ github.event.inputs.mode }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check environment variables
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "TELEGRAM_BOT_TOKEN mangler"
            exit 1
          fi

          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_CHAT_ID mangler"
            exit 1
          fi

          if [ -z "$BOT_MODE" ]; then
            echo "BOT_MODE mangler"
            exit 1
          fi

          echo "Telegram secrets finnes ✅"
          echo "BOT_MODE=$BOT_MODE"

      - name: Run stock bot
        run: python stock_bot.py

      - name: Commit updated data files
        if: always()
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git pull --rebase origin main || true

          if [ -d "data" ]; then
            git add data/
          else
            echo "Ingen data-mappe finnes ennå."
          fi

          if git diff --cached --quiet; then
            echo "Ingen data-endringer å committe."
          else
            git commit -m "Update AI Stock Lab data"
            git push origin main
          fi
