name: Signal — Bygg signalfil

on:
  schedule:
    - cron: "0 21 * * 1-5"   # 21:00 UTC = 23:00 Oslo (CEST), etter US-børslutt
  workflow_dispatch:
    inputs:
      mode:
        description: 'Bot-modus (signal kjøres automatisk via cron)'
        required: false
        default: 'signal'
        type: choice
        options:
          - signal
          - backtest

permissions:
  contents: write
  actions: write

concurrency:
  group: ai-stock-lab-signal
  cancel-in-progress: false

jobs:
  signal:
    runs-on: ubuntu-latest

    env:
      BOT_MODE: ${{ inputs.mode || 'signal' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Phase 1: Run signal analysis → saves draft (publication_status="draft")
      - name: Run signal (draft)
        run: python stock_bot.py

      # Phase 2: Commit and push the draft signal + ledger records
      - name: Commit og push utkast-signal
        id: draft_push
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add data_v4/ || true

          if git diff --cached --quiet; then
            echo "Ingen endringer å committe."
            echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
            exit 0
          fi

          git commit -m "Signal draft: $(date -u +%Y-%m-%d)"

          for attempt in 1 2 3; do
            if git push origin main; then
              echo "Push OK ✅"
              echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "Push feilet (forsøk $attempt/3) — henter nyeste og prøver igjen..."
            git pull --rebase origin main
          done

          echo "Push feilet etter 3 forsøk ❌"
          exit 1

      # Phase 3: Finalize signal — sets published fields + writes publication record
      # Only runs after successful push; SIGNAL_COMMIT_SHA is the SHA of the draft commit.
      - name: Finaliser signal-publikasjon
        env:
          BOT_MODE: finalize_signal
          SIGNAL_COMMIT_SHA: ${{ steps.draft_push.outputs.sha }}
        run: python stock_bot.py

      # Phase 4: Commit and push the finalized signal + publication record
      # Not run if Phase 3 (finalize_signal) failed — avoids pushing incomplete state
      - name: Commit og push finalisert signal
        id: final_push
        run: |
          git add data_v4/ || true

          if git diff --cached --quiet; then
            echo "Ingen endringer etter finalisering."
            echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
            exit 0
          fi

          git commit -m "Signal published: $(date -u +%Y-%m-%d)"

          for attempt in 1 2 3; do
            if git push origin main; then
              echo "Finalisert signal pushet ✅"
              echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "Push feilet (forsøk $attempt/3)..."
            git pull --rebase origin main
          done

          echo "Push av finalisert signal feilet etter 3 forsøk ❌"
          exit 1

      # Phase 5: Persistence-ack — record the finalized commit SHA
      # This proves the finalized signal file is in git and the SHA is traceable.
      - name: Skriv persistence-ack (finalized_commit_sha)
        env:
          BOT_MODE: ack_publication
          FINAL_COMMIT_SHA: ${{ steps.final_push.outputs.sha }}
        run: python stock_bot.py

      # Phase 6: Commit and push the ack record (signal_publications.jsonl)
      - name: Commit og push persistence-ack
        run: |
          git add data_v4/ledger/signal_publications.jsonl || true

          if git diff --cached --quiet; then
            echo "Ingen ack å committe (allerede ack-et)."
            exit 0
          fi

          git commit -m "Signal finalized_ack: $(date -u +%Y-%m-%d)"

          for attempt in 1 2 3; do
            if git push origin main; then
              echo "Persistence-ack pushet ✅"
              exit 0
            fi
            echo "Push feilet (forsøk $attempt/3)..."
            git pull --rebase origin main
          done

          echo "Push av persistence-ack feilet etter 3 forsøk ❌"
          exit 1
