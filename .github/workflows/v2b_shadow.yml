name: V2B Shadow Collection + Report

# SHADOW ONLY — this workflow never creates orders, fills, or trades.
# It records V2 factor scores to the V2B ledger for prospective OOS evaluation
# and sends a clearly labeled "V2 SHADOW — INGEN HANDLER" Telegram report.
# order_creation_blocked = True is a structural invariant in all scripts.
#
# Two-job structure (V2B.4):
#   Job 1: shadow-collection-report — collection + report + commit observation/report
#   Job 2: outcome-tracker          — fresh checkout, run outcome tracker, commit outcomes
#
# Job 2 needs: shadow-collection-report (runs even if job 1 fails — if: always())
# Outcome outcomes are committed separately so an outcome tracker failure never
# prevents observation/report data from being committed (and vice versa).

on:
  workflow_dispatch:
    inputs:
      as_of_date:
        description: 'Signal date (YYYY-MM-DD). Must be today in America/New_York. Historical dates rejected — V2B.2 has no point-in-time data source. Leave blank to use today.'
        required: false
        default: ''
        type: string

  schedule:
    # 21:30 UTC Mon–Fri (after US market close at 16:00 ET = 20:00–21:00 UTC)
    - cron: "30 21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: v2b-shadow-collection
  cancel-in-progress: false

jobs:
  # ── Job 1: Shadow collection + report ──────────────────────────────────────
  shadow-collection-report:
    runs-on: ubuntu-latest

    env:
      V2B_AS_OF_DATE: ${{ inputs.as_of_date || '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run V2B shadow collection
        # Exits 0 immediately if today is not a NYSE trading session.
        # Exchange calendar decides — no cron skipping needed.
        run: python v2b_daily_shadow.py

      - name: Run V2B shadow report
        # Runs in the same job as the collector so both use the same wall-clock day
        # (America/New_York) to derive intended_execution_session. Running them in the
        # same job prevents a midnight edge case where a later separate workflow would
        # compute a different session from the one the collector used.
        # On FAILED (missing observation): exits 0 — V1 is never blocked by a V2 failure.
        # On CONFLICT: exits 1 — manual review required.
        run: python v2b_daily_report.py

      - name: Commit V2B ledger and report
        if: always()
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          # Only stage V2B ledger and report files — never V1 state, fills, orders, or cache
          git add data_v4/v2b_ledger/*.jsonl data_v4/v2b_ledger/v2b_idx.json 2>/dev/null || true
          git add data_v4/v2b_reports/*.jsonl data_v4/v2b_reports/v2b_report_idx.json 2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m "V2B shadow: $(date -u +%Y-%m-%d)"
          else
            echo "No V2B ledger/report changes to commit."
            exit 0
          fi

          # Conflict-safe push: pull --rebase on failure, up to 3 attempts
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "Push OK"
              exit 0
            fi
            echo "Push failed (attempt $attempt/3) — pulling and retrying..."
            git pull --rebase origin main
          done

          echo "Push failed after 3 attempts"
          exit 1

  # ── Job 2: Outcome tracker ──────────────────────────────────────────────────
  outcome-tracker:
    runs-on: ubuntu-latest
    needs: shadow-collection-report
    if: always()

    steps:
      - name: Check out repository (fresh from origin/main)
        # Fresh checkout ensures we see any observation data committed by job 1.
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run V2B outcome tracker
        # Exit codes:
        #   0 — all outcomes processed successfully
        #   1 — transport errors (commit step skipped — retry tomorrow)
        #   2 — integrity failure (CorruptionError) or import error
        #   3 — not a trading session today (soft skip)
        # allow_failure_exit: 1 and 3 are expected non-error exits.
        id: run_tracker
        run: |
          python v2b_daily_outcome.py
          echo "tracker_exit=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Commit V2B outcome data
        # Only commit on exit code 0 — do not commit partial data on transport errors.
        if: steps.run_tracker.outcome == 'success'
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          # Only stage V2B outcome files — never V1 state or other data
          git add data_v4/v2b_outcomes/*.jsonl data_v4/v2b_outcomes/v2b_outcome_idx.json 2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m "V2B outcomes: $(date -u +%Y-%m-%d)"
          else
            echo "No V2B outcome changes to commit."
            exit 0
          fi

          # Conflict-safe push: pull --rebase on failure, up to 3 attempts
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "Push OK"
              exit 0
            fi
            echo "Push failed (attempt $attempt/3) — pulling and retrying..."
            git pull --rebase origin main
          done

          echo "Push failed after 3 attempts"
          exit 1
